name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The JavaScript fixture's ground truth is executed with node; without it
      # those tests are skipped, so the job pins a version instead.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validator and fixture tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s evals -p 'test_*.py' -v
